<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MoodVibe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
    <div class="auth-background parallax-bg"></div>
    <div class="auth-container">
        <div class="auth-form-container">
            <div class="auth-header">
                <a href="/" class="logo">MoodVibe</a>
                <h2>Reset your password</h2>
                <p>Enter your email and we will send you a secure reset link.</p>
            </div>
            {% if message %}<p>{{ message }}</p>{% endif %}
            <form class="auth-form" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit" class="auth-button">Send Reset Link</button>
            </form>
            <div class="auth-footer"><a href="/login">Back to Sign In</a></div>
        </div>
    </div>
</body>
</html>
