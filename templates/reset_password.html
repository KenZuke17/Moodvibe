<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MoodVibe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
    <div class="auth-background parallax-bg"></div>
    <div class="auth-container">
        <div class="auth-form-container">
            <div class="auth-header">
                <a href="/" class="logo">MoodVibe</a>
                <h2>Choose a new password</h2>
            </div>
            {% if invalid_token %}
                <p>This reset link is invalid or has expired.</p>
                <div class="auth-footer"><a href="/forgot-password">Request a new link</a></div>
            {% elif success %}
                <p>Your password has been reset successfully.</p>
                <div class="auth-footer"><a href="/login">Sign in</a></div>
            {% else %}
                {% if error %}<p>{{ error }}</p>{% endif %}
                <form class="auth-form" method="post">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmation">Confirm Password</label>
                        <input type="password" id="confirmation" name="confirmation" minlength="6" required>
                    </div>
                    <button type="submit" class="auth-button">Reset Password</button>
                </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
